name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install pinned dependencies
        run: pip install "numpy==2.4.6" "scikit-learn==1.9.1" "scipy==1.18.1" "pytest>=8"
      - name: Baseline checksums, wording gate, tests
        run: make check
